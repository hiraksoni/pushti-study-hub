<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pushti's Master Study Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --sidebar-bg: #2B2620;
        --sidebar-text: #F9F5EC;
        --sidebar-hover: #4A1A1D;
        --sidebar-active: #7A2A2E;
        --gold: #C59B27;
    }
    body {
        margin: 0;
        padding: 0;
        display: flex;
        height: 100vh;
        font-family: 'Nunito', sans-serif;
        background-color: #F9F5EC;
        overflow: hidden;
    }
    #sidebar {
        width: 300px;
        background-color: var(--sidebar-bg);
        color: var(--sidebar-text);
        display: flex;
        flex-direction: column;
        box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        z-index: 10;
        overflow-y: auto;
    }
    .sidebar-header {
        padding: 24px 20px;
        text-align: center;
        background: linear-gradient(135deg, #1a1612, #2B2620);
        border-bottom: 3px solid var(--gold);
    }
    .sidebar-header h1 {
        font-family: 'Cinzel', serif;
        margin: 0;
        font-size: 1.6rem;
        color: var(--gold);
        letter-spacing: 1px;
    }
    .sidebar-header p {
        margin: 8px 0 0 0;
        font-size: 0.9rem;
        opacity: 0.8;
    }
    .nav-links {
        list-style: none;
        padding: 0;
        margin: 0;
        flex-grow: 1;
    }
    .nav-item {
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .nav-btn {
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--sidebar-text);
        padding: 16px 20px;
        font-size: 1rem;
        font-family: 'Nunito', sans-serif;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
    }
    .nav-btn:hover {
        background-color: var(--sidebar-hover);
        padding-left: 25px;
    }
    .nav-btn.active {
        background-color: var(--sidebar-active);
        border-left: 4px solid var(--gold);
    }
    .chap-num {
        font-weight: 800;
        color: var(--gold);
        margin-right: 12px;
        font-size: 1.1rem;
        min-width: 45px;
    }
    .chap-title {
        line-height: 1.3;
    }
    #content-area {
        flex-grow: 1;
        background-color: #fff;
        position: relative;
    }
    iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
    .welcome-screen {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #F9F5EC;
        z-index: 5;
        padding: 40px;
    }
    .welcome-screen h2 {
        font-family: 'Cinzel', serif;
        color: #7A2A2E;
        font-size: 2.5rem;
        margin-bottom: 10px;
    }
    .welcome-screen p {
        font-size: 1.2rem;
        color: #2B2620;
        max-width: 600px;
    }
</style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <h1>Pushti's Hub</h1>
        <p>Master Study Dashboard</p>
    </div>
    <ul class="nav-links">

        <li class="nav-item">
            <button class="nav-btn" onclick="loadChapter('gemini-code-1786806264249.html', this)">
                <span class="chap-num">Ch 1</span>
                <span class="chap-title">Interior of the Earth</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-btn" onclick="loadChapter('gemini-code-1786807311533 (1).html', this)">
                <span class="chap-num">Ch 2</span>
                <span class="chap-title">Our Changing Earth</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-btn" onclick="loadChapter('gemini-code-1786868059204.html', this)">
                <span class="chap-num">Ch 6</span>
                <span class="chap-title">The First Indian Empire</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-btn" onclick="loadChapter('gemini-code-1786869713516.html', this)">
                <span class="chap-num">Ch 7</span>
                <span class="chap-title">India in the Iron Age</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-btn" onclick="loadChapter('gemini-code-1786554270939.html', this)">
                <span class="chap-num">Ch 8</span>
                <span class="chap-title">Ultimate Master Visual Hub</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-btn" onclick="loadChapter('gemini-code-1786870843828.html', this)">
                <span class="chap-num">Ch 13</span>
                <span class="chap-title">Understanding Gender</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-btn" onclick="loadChapter('gemini-code-1786873269831.html', this)">
                <span class="chap-num">Ch 14</span>
                <span class="chap-title">How Does Democracy Work?</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-btn" onclick="loadChapter('gemini-code-1786875375575.html', this)">
                <span class="chap-num">Ch 17</span>
                <span class="chap-title">Markets Around Us</span>
            </button>
        </li>
    </ul>
</div>

<div id="content-area">
    <div class="welcome-screen" id="welcome">
        <h2>Welcome, Pushti! 🌟</h2>
        <p>Select a chapter from the menu on the left to start exploring your interactive study notes and quizzes. You're going to ace your exams!</p>
    </div>
    <iframe id="chapter-frame" src="about:blank" title="Chapter Content"></iframe>
</div>

<script>
    function loadChapter(file, btnElement) {
        // Hide welcome screen
        document.getElementById('welcome').style.display = 'none';
        
        // Load iframe
        document.getElementById('chapter-frame').src = file;
        
        // Update active state
        const buttons = document.querySelectorAll('.nav-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
    }
</script>
</body>
</html>
