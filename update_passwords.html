<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firebase User Password Updater — One-Time Tool</title>
<style>
  body { font-family: monospace; background: #0f0f1a; color: #e2e8f0; padding: 40px; }
  h1 { color: #818cf8; }
  pre { background: #1e293b; padding: 16px; border-radius: 8px; border: 1px solid #334155; }
  .ok { color: #34d399; font-weight: bold; }
  .err { color: #f87171; font-weight: bold; }
  button {
    margin-top: 20px;
    padding: 12px 28px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #6366f1; }
  #log { margin-top: 24px; white-space: pre-wrap; line-height: 1.7; }
</style>
</head>
<body>
<h1>🔐 Firebase User Password Updater</h1>
<p>This one-time tool updates <code>settings/users</code> in Firestore with the new passwords.<br>
Open this file in your browser, then click the button below.</p>
<pre>
  admin   → lokijuhy
  hirak   → qwerty
  pushti  → pushti123 (unchanged)
</pre>
<button onclick="runUpdate()">▶ Run Update Now</button>
<div id="log"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA9eTc8d-AzQMtgLYqZ8DAzYgFnTI4YgNo",
    authDomain: "pushti-study-hub-c5961.firebaseapp.com",
    projectId: "pushti-study-hub-c5961",
    storageBucket: "pushti-study-hub-c5961.firebasestorage.app",
    messagingSenderId: "385702072981",
    appId: "1:385702072981:web:c0a4c656642f50a674019c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const log = document.getElementById('log');
  function write(msg) { log.innerHTML += msg + '\n'; }

  window.runUpdate = async function() {
    log.innerHTML = '';
    write('⏳ Connecting to Firestore...');

    const usersRef = doc(db, 'settings', 'users');

    // First read existing doc to preserve any fields we don't know about
    let existingData = {};
    try {
      const snap = await getDoc(usersRef);
      if (snap.exists()) {
        existingData = snap.data();
        write('✅ Read existing settings/users document.');
      } else {
        write('ℹ️  No existing document — will create fresh.');
      }
    } catch (e) {
      write('<span class="err">❌ Read failed: ' + e.message + '</span>');
      return;
    }

    // Merge updated user records
    const updatedUsers = {
      ...existingData,
      pushti: { name: 'Pushti', pass: 'pushti123', role: 'student', bg: '8B5CF6' },
      hirak:  { name: 'Hirak',  pass: 'qwerty',    role: 'parent',  bg: '10B981' },
      admin:  { name: 'Admin',  pass: 'lokijuhy',   role: 'admin',   bg: 'EF4444' }
    };

    try {
      await setDoc(usersRef, updatedUsers);
      write('<span class="ok">✅ Firestore settings/users updated successfully!</span>');
      write('');
      write('   admin   password → lokijuhy');
      write('   hirak   password → qwerty');
      write('   pushti  password → pushti123 (unchanged)');
      write('');
      write('<span class="ok">🎉 Done. You can close this tab.</span>');
    } catch (e) {
      write('<span class="err">❌ Write failed: ' + e.message + '</span>');
      write('   This may be a Firestore security rules issue.');
      write('   The local fallback in index.html has already been updated.');
    }
  };
</script>
</body>
</html>
