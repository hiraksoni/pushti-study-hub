<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pushti's Maths Practice 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --primary: #f97316;
    --primary-light: #fff7ed;
    --accent: #8b5cf6;
    --accent-light: #f5f3ff;
    --green: #22c55e;
    --green-light: #f0fdf4;
    --blue: #3b82f6;
    --blue-light: #eff6ff;
    --text: #1e1b4b;
    --muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #f97316, #f59e0b, #8b5cf6);
    padding: 28px 20px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.07'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  header h1 {
    font-family: 'Baloo 2', cursive;
    font-size: 2rem;
    font-weight: 800;
    color: white;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    position: relative;
  }
  header p {
    color: rgba(255,255,255,0.9);
    font-size: 0.95rem;
    margin-top: 6px;
    position: relative;
  }
  .stars-row {
    font-size: 1.2rem;
    margin-top: 8px;
    position: relative;
    letter-spacing: 4px;
  }

  /* SCORE BAR */
  .score-bar {
    background: white;
    border-bottom: 2px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .score-pill {
    background: var(--primary-light);
    border: 2px solid var(--primary);
    border-radius: 30px;
    padding: 5px 16px;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    color: var(--primary);
    font-size: 0.95rem;
  }
  .progress-wrap {
    flex: 1;
    min-width: 120px;
    height: 10px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 10px;
    transition: width 0.5s ease;
  }
  .chapter-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 10px 20px;
    background: white;
    border-bottom: 1px solid var(--border);
  }
  .chapter-nav button {
    font-family: 'Nunito', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: white;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--muted);
  }
  .chapter-nav button.active, .chapter-nav button:hover {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary);
  }

  /* MAIN */
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* CHAPTER SECTION */
  .chapter-section {
    margin-bottom: 40px;
  }
  .chapter-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.3rem;
    font-weight: 800;
    color: white;
    background: linear-gradient(135deg, var(--accent), #6d28d9);
    padding: 12px 20px;
    border-radius: var(--radius) var(--radius) 0 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chapter-title .num {
    background: rgba(255,255,255,0.25);
    border-radius: 8px;
    padding: 2px 10px;
    font-size: 0.85rem;
  }
  .chapter-body {
    background: var(--card);
    border: 2px solid #e0e7ff;
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 4px 0 16px;
  }

  /* QUESTION CARD */
  .q-card {
    margin: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .q-card.answered { border-color: var(--green); }
  .q-card:hover { border-color: var(--accent); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    cursor: default;
  }
  .q-num {
    background: var(--accent);
    color: white;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 0.85rem;
    min-width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .q-text {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.5;
    flex: 1;
  }
  .q-mark {
    font-size: 1.2rem;
    flex-shrink: 0;
  }

  /* VISUAL HINT */
  .q-visual {
    background: var(--blue-light);
    border-top: 1px solid #bfdbfe;
    padding: 10px 16px;
    font-size: 0.88rem;
    color: var(--blue);
    font-weight: 600;
    font-family: 'Baloo 2', cursive;
  }
  .q-visual .vbox {
    background: white;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 6px;
    font-family: monospace;
    font-size: 0.95rem;
    color: #1e3a8a;
    white-space: pre;
    line-height: 1.6;
  }

  /* ANSWER REVEAL */
  .ans-toggle {
    width: calc(100% - 32px);
    margin: 0 16px 4px;
    background: var(--primary-light);
    border: 2px dashed var(--primary);
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    font-family: 'Baloo 2', cursive;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .ans-toggle:hover {
    background: #ffedd5;
    border-style: solid;
  }
  .ans-toggle .lock { font-size: 1.1rem; }

  .ans-box {
    display: none;
    margin: 0 16px 4px;
    background: var(--green-light);
    border: 2px solid var(--green);
    border-radius: 10px;
    padding: 14px 16px;
    animation: slideDown 0.25s ease;
  }
  .ans-box.open { display: block; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ans-label {
    font-family: 'Baloo 2', cursive;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ans-content {
    font-size: 0.95rem;
    line-height: 1.7;
    color: #166534;
    font-weight: 600;
  }
  .ans-content .step {
    background: white;
    border-left: 3px solid var(--green);
    padding: 4px 10px;
    margin: 4px 0;
    border-radius: 0 6px 6px 0;
    font-size: 0.9rem;
  }
  .ans-content .note {
    background: #fef9c3;
    border: 1px solid #fde047;
    border-radius: 6px;
    padding: 6px 10px;
    margin-top: 6px;
    font-size: 0.85rem;
    color: #713f12;
  }
  .ans-content .formula {
    background: #dbeafe;
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'Baloo 2', cursive;
    font-size: 1rem;
    color: #1e3a8a;
    margin: 4px 0;
    text-align: center;
  }

  /* DONE BUTTON */
  .done-btn {
    display: block;
    margin: 8px auto 0;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 6px 18px;
    font-family: 'Baloo 2', cursive;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .done-btn:hover { background: #16a34a; }

  /* CELEBRATION */
  .celebration {
    text-align: center;
    padding: 40px 20px;
    display: none;
  }
  .celebration.show { display: block; }
  .celebration .big-star { font-size: 4rem; }
  .celebration h2 {
    font-family: 'Baloo 2', cursive;
    font-size: 2rem;
    color: var(--primary);
    margin: 12px 0 8px;
  }

  /* RESPONSIVE */
  @media (max-width: 480px) {
    header h1 { font-size: 1.5rem; }
    .q-text { font-size: 0.95rem; }
    .chapter-title { font-size: 1.1rem; }
  }
</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const searchInput = document.querySelector('.search-input');
    if(searchInput) {
        searchInput.addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.chapter-card, .topic-card, .shloka-box, .translation-row, .shloka-block');
            if (cards.length > 0) {
                cards.forEach(card => {
                    if(card.innerText.toLowerCase().includes(term)) {
                        card.style.display = '';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }
        });
    }
});

    questions: [
      {
        q: 'Find the next number: 6, 12, 18, 24, ___',

              <div class="note">💡 When addition doesn't work evenly, try multiplication!</div>`

      {
        q: 'Fill the blank: 3, 7, 11, 15, ___',

        ans: `<div class="step">Differences: 7-3=4, 11-7=4, 15-11=4 → Rule: +4</div>
              <div class="step">15 + 4 = <strong>19</strong></div>`
      },
      {
        q: 'Matchstick squares — Step 1 has 4 sticks, Step 2 has 7, Step 3 has 10. How many in Step 5?',

Step 2: □□ (7 sticks)

Step ?: □□□□□ = ?`,

              <div class="step">Pattern: 4, 7, 10, 13, <strong>16</strong></div>
              <div class="note">💡 Or use formula: 3n + 1, where n = step number → 3×5+1 = 16</div>`
      },
      {

4 = 2×2
9 = 3×3

__ = 5×5`,

              <div class="step">5 × 5 = <strong>25</strong></div>
              <div class="note">💡 This pattern is called "Square Numbers"!</div>`

  },
  {

    questions: [
      {
        q: 'Define a Line Segment. How is it different from a Line?',
        visual: null,
        ans: `<div class="step"><strong>Line:</strong> Extends forever in both directions → ←——→</div>
              <div class="step"><strong>Line Segment:</strong> Has two fixed endpoints → A——B</div>
              <div class="note">💡 A pencil is like a line segment — it has a start and end!</div>`
      },
      {
        q: 'Name the type of angle: 35°, 90°, 120°, 180°',
        visual: `Acute:  < 90°   looks like a sharp pizza slice 🍕

Straight: 180°  looks like a flat line ——`,

              <div class="step">90° → <strong>Right Angle</strong></div>
              <div class="step">120° → <strong>Obtuse</strong> (between 90° and 180°)</div>

      {

12 o'clock is at top

      {
        q: 'Find the angle between clock hands at 4:00.',

     S (180°)`,

// Flatten all questions for total count
let totalQ = 0;
chapters.forEach(c => totalQ += c.questions.length);
document.getElementById('total-count').textContent = totalQ;

let doneSet = new Set();

function updateScore() {
  const done = doneSet.size;
  document.getElementById('done-count').textContent = done;
  const pct = Math.round((done / totalQ) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  const msgs = ['Keep going, Pushti! 💪', 'You are doing great! 🌟', 'Almost there! ⭐', 'Superstar! 🏆'];
  const idx = pct < 25 ? 0 : pct < 60 ? 1 : pct < 90 ? 2 : 3;
  document.getElementById('score-msg').textContent = msgs[idx];
}

function buildNav() {
  const nav = document.getElementById('chapter-nav');
  chapters.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.textContent = ch.emoji + ' Ch' + (i+1);
    btn.onclick = () => {
      document.getElementById(ch.id).scrollIntoView({behavior:'smooth', block:'start'});
    };
    nav.appendChild(btn);
  });
}

function buildContent() {
  const main = document.getElementById('main-content');
  let qGlobal = 0;

  chapters.forEach((ch, ci) => {
    const sec = document.createElement('div');
    sec.className = 'chapter-section';
    sec.id = ch.id;

    sec.innerHTML = `<div class="chapter-title">${ch.emoji} ${ch.title} <span class="num">${ch.questions.length} Qs</span></div>
                     <div class="chapter-body" id="body-${ch.id}"></div>`;
    main.appendChild(sec);

    const body = sec.querySelector('.chapter-body');
    ch.questions.forEach((q, qi) => {
      const qId = `q-${ci}-${qi}`;
      qGlobal++;
      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = qId;

      let visualHtml = '';
      if (q.visual) {
        visualHtml = `<div class="q-visual">💡 Visual clue:<div class="vbox">${q.visual}</div></div>`;
      }

      card.innerHTML = `
        <div class="q-header">
          <div class="q-num">${qGlobal}</div>
          <div class="q-text">${q.q}</div>
          <div class="q-mark" id="mark-${qId}"></div>
        </div>
        ${visualHtml}
        <button class="ans-toggle" id="toggle-${qId}" onclick="toggleAns('${qId}')">
          <span class="lock">🔒</span> Try it first! Click here ONLY after you have tried...
        </button>
        <div class="ans-box" id="ans-${qId}">
          <div class="ans-label">✅ Answer & Explanation</div>
          <div class="ans-content">${q.ans}</div>
        </div>
        <button class="done-btn" id="done-${qId}" onclick="markDone('${qId}')" style="display:none;">Mark as Done ✓</button>
      `;
      body.appendChild(card);
    });
  });
}

let openedAnswers = new Set();

function toggleAns(qId) {
  const box = document.getElementById('ans-' + qId);
  const btn = document.getElementById('toggle-' + qId);
  const doneBtn = document.getElementById('done-' + qId);
  
  if (box.classList.contains('open')) {
    box.classList.remove('open');
    btn.innerHTML = '<span class="lock">🔒</span> Try it first! Click here ONLY after you have tried...';
    doneBtn.style.display = 'none';
  } else {
    box.classList.add('open');
    btn.innerHTML = '<span class="lock">🔓</span> Hide answer';
    doneBtn.style.display = 'block';
    openedAnswers.add(qId);
  }
}

function markDone(qId) {
  doneSet.add(qId);
  const card = document.getElementById(qId);
  card.classList.add('answered');
  document.getElementById('mark-' + qId).textContent = '✅';
  document.getElementById('done-' + qId).style.display = 'none';
  updateScore();
}

buildNav();
buildContent();
updateScore();
</script>
