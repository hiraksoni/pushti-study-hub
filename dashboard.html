<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=index.html">
    <title>Redirecting...</title>
</head>
<body>
    <script>window.location.replace("index.html");</script>

<!-- FIREBASE TIMER INJECTION START -->
<script type="module">
    import { db, doc, setDoc, increment } from './firebase-config.js';
    
    // Time Tracker
    setInterval(() => {
        const activeUser = localStorage.getItem('pushti-active-user');
        if (activeUser === 'pushti' || activeUser === 'hirak') {
            const statsRef = doc(db, 'user_stats', activeUser);
            // Increment total_time by 60 seconds
            setDoc(statsRef, { total_time: increment(60) }, { merge: true })
                .catch(err => console.error("Error logging time:", err));
        }
    }, 60000); // 60 seconds
</script>
<!-- FIREBASE TIMER INJECTION END -->

</body>
</html>
